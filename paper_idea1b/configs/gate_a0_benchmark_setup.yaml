training_contract:
  dataset: COCO2017
  crop_size: 256
  switch_to_div2k: false

communication:
  source_real_channels: 3
  real_coordinates_per_complex_use: 2
  s33_budget_cbr: 0.041666666666666664
  s33_tile_size: 256
  s33_real_symbols_per_tile: 16384
  swin_real_symbols_per_tile: 16384
  diffjscc:
    processing: official_whole_frame
    minimum_short_edge: 512
    pad_multiple: 64
    channel_downsample: 16
    main_latent_channels: 16
    receiver_generated_caption_real_symbols: 0
  sgd_paper_upper:
    processing: official_split_image_v2
    patch_size: 128
    main_real_symbols_per_patch: 4096
    active_edge_real_symbols_per_patch: 832
    caption_accounting: perfect_sender_caption_unpriced_in_paper
    ranking_eligible: false

metrics:
  full_reference: [psnr, ms_ssim, lpips, dists]
  distribution:
    datasets: [clic2020_test]
    metrics: [fid, kid]
    clean_fid_mode: clean
  semantic_future_a1:
    unlabeled: [clip_image_similarity, dreamsim]
    supervised_reliability: imagenette_policy_dev
    official_imagenette_validation: sealed
  identity_thresholds:
    psnr_identity_min_db: 119.999
    ms_ssim_abs_from_one_max: 1.0e-6
    lpips_abs_max: 1.0e-6
    dists_abs_max: 1.0e-5
    fid_abs_max: 1.0e-4
    kid_abs_max: 1.0e-2
  download:
    parallel_workers: 32
    range_chunk_bytes: 1048576
    metric_weights_root: paper_idea1b/data/metric_weights
    metric_weights:
      - name: torchvision_vgg16
        url: https://download.pytorch.org/models/vgg16-397923af.pth
        filename: vgg16-397923af.pth
        expected_bytes: 553433881
      - name: clean_fid_inception
        url: https://nvlabs-fi-cdn.nvidia.com/stylegan2-ada-pytorch/pretrained/metrics/inception-2015-12-05.pt
        filename: inception-2015-12-05.pt
        expected_bytes: 95607719

