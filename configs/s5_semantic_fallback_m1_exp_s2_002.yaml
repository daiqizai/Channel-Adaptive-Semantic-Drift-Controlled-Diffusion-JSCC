phase: S5
experiment_id: EXP-S4-001
method: M3-PseudoClassifierFallbackPilot
dataset: COCO2017
image_size: 256
channel: AWGN
snrs: [1, 7, 19]
cbr: 0.17
seed: 42

inputs:
  m0_export_dir: outputs/eval/s2_deepjscc_coco256_awgn_best_m0_export
  original_dir: outputs/eval/s2_deepjscc_coco256_awgn_best_m0_export/exports/original
  m1_output_dir: outputs/EXP-S2-002
  m1_metrics: outputs/EXP-S2-002/metrics.json
  classifier_per_sample: outputs/EXP-S3-002/per_sample.csv
  classifier_metrics: outputs/EXP-S3-002/metrics.json
  source_manifest: outputs/EXP-S2-002/source_manifest.json
  checkpoint: outputs/train/s2_deepjscc_coco256_awgn_snr7_cbr017/checkpoints/best.pt
  forbidden_checkpoint: outputs/train/s2_deepjscc_coco256_awgn_snr7_cbr017/checkpoints/latest.pt

control:
  detector: top1_agreement_with_m0
  accept_when: m1_classifier_top1_equals_m0_classifier_top1
  fallback_output: m0_reconstruction
  semantic_model: torchvision_alexnet_imagenet1k_v1
  uses_original_for_detection: false

evaluation:
  num_samples: 16
  pseudo_clean_conf_thresholds: [0.20, 0.30]
  sample_grid_count: 4
  metrics: [psnr, ssim, ms_ssim, lpips_optional, pseudo_final_failure, accept_rate, reject_rate]

outputs:
  output_dir: outputs/EXP-S4-001
