phase: S5
analysis_id: exp_s4_006_risk_rule_candidate_outputs
source_experiment: EXP-S4-006
method: MaterializeSelectedRiskRuleGateCandidate
dataset: COCO2017
image_size: 256
channel: AWGN
snrs: [1, 4, 7, 13, 19]
cbr: 0.17
seed: 42

inputs:
  policy_decisions_csv: outputs/analysis/exp_s4_006_conf_gain_risk_rule_sweep/policy_decisions.csv
  policy_summary_csv: outputs/analysis/exp_s4_006_conf_gain_risk_rule_sweep/policy_summary.csv
  source_risk_rule_config: configs/s5_conf_gain_risk_rule_sweep_exp_s4_006.yaml
  checkpoint: outputs/train/s2_deepjscc_coco256_awgn_snr7_cbr017/checkpoints/best.pt
  forbidden_checkpoint: outputs/train/s2_deepjscc_coco256_awgn_snr7_cbr017/checkpoints/latest.pt

policy:
  name: selected_risk_rule
  baseline: top1_equal
  source_candidate: top1_equal_or_refined_conf_gain_ge_0p05
  decision_source: outputs/analysis/exp_s4_006_conf_gain_risk_rule_sweep/policy_decisions.csv
  rule:
    new_accept_clip_sim_m0_refined_min: 0.90
    top5_overlap_min: null
    shadow_veto_if:
      m0_top1_rank_in_refined_top5_max: 2
      m0_top1_margin_max: 0.07
      refined_top1_margin_min: 0.05
  uses_original_for_detection: false
  note: validation-tuned receiver-side risk rule; not final M3 until formal test split

evaluation:
  sample_grid_count: 8
  warning: candidate is pseudo-label validation/held-out evidence only

outputs:
  output_dir: outputs/analysis/exp_s4_006_risk_rule_candidate_outputs
