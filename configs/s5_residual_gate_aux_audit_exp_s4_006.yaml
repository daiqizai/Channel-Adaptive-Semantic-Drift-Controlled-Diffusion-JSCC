phase: S5
analysis_id: exp_s4_006_conf_gain_gate_aux_audit
source_experiment: EXP-S4-006
method: ResidualGateConfidenceGainAuxiliarySemanticAudit
dataset: COCO2017
image_size: 256
channel: AWGN
snrs: [1, 4, 7, 13, 19]
cbr: 0.17
seed: 42

inputs:
  gate_predictions_csv: outputs/analysis/exp_s4_006_gate_policy_sweep/topk_predictions.csv
  gate_policy_summary_csv: outputs/analysis/exp_s4_006_gate_policy_sweep/policy_summary.csv
  m0_source_manifest: outputs/eval/s2_deepjscc_coco256_awgn_best_m0_export_256/source_manifest.json
  coco_captions: data/coco/annotations/captions_val2017.json
  checkpoint: outputs/train/s2_deepjscc_coco256_awgn_snr7_cbr017/checkpoints/best.pt
  forbidden_checkpoint: outputs/train/s2_deepjscc_coco256_awgn_snr7_cbr017/checkpoints/latest.pt

policy:
  baseline: top1_equal
  candidate: top1_equal_or_refined_conf_gain_ge_0p05
  refined_conf_gain_margin: 0.05

clip:
  backend: open_clip
  model_name: ViT-B-32
  pretrained: openai
  pretrained_url: https://openaipublic.azureedge.net/clip/models/40d365715913c9da98579312b702a82c18be219cc2a73407c4526f58eba950af/ViT-B-32.pt
  pretrained_path: outputs/cache/open_clip/ViT-B-32.pt
  cache_dir: outputs/cache/open_clip
  batch_size: 32
  text_batch_size: 64
  precision: fp32
  weights_only: false
  force_quick_gelu: true
  image_mean: [0.48145466, 0.4578275, 0.40821073]
  image_std: [0.26862954, 0.26130258, 0.27577711]
  image_interpolation: bicubic
  image_resize_mode: shortest

evaluation:
  caption_score: max
  gallery_cases_per_type: 12
  auxiliary_nonworse_epsilon: 0.0

outputs:
  output_dir: outputs/analysis/exp_s4_006_conf_gain_gate_aux_audit
