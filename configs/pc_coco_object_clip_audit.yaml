phase: S5-validation
study: posterior_consistency
analysis_id: ANALYSIS-PC-GT-001
seed: 20260719
source_config: configs/s13_coco_train2017_c8_scaleup_export.yaml
source_rank_start: 11832
sample_count: 512
snrs: [1, 4, 7, 13, 19]
batch_size: 8
proximal_steps: 3
normalized_step_size: 0.001
b1_config: configs/s13_scaleup_b1_anchor_train.yaml
b1_checkpoint: outputs/EXP-S13-001/checkpoints/best.pt
diffusion_config: configs/s14_scaleup_b1_anchored_diffusion.yaml
diffusion_checkpoint: outputs/EXP-S14-001/checkpoints/best.pt
deepjscc_checkpoint: outputs/train/s2_deepjscc_coco256_awgn_snr7_cbr017/checkpoints/best.pt
failure_handling:
  classifiers: [alexnet, resnet18]
  accept_when: posterior_top1_equals_b1_anchor_top1_for_all_controller_models
  fallback: anchor
  uses_original: false
classifiers:
  cache_dir: outputs/cache/torch
  models:
    - key: alexnet
      model_name: alexnet
      weights_enum: AlexNet_Weights
      weights: IMAGENET1K_V1
      weights_file: outputs/cache/torch/hub/checkpoints/alexnet-owt-7be5be79.pth
    - key: resnet18
      model_name: resnet18
      weights_enum: ResNet18_Weights
      weights: IMAGENET1K_V1
      weights_file: outputs/cache/torch/hub/checkpoints/resnet18-f37072fd.pth
coco_object_clip_audit:
  instances_file: data/coco/annotations/instances_train2017.json
  dominant_category_min_area_ratio: 0.03
  dominant_category_min_share: 0.50
  ignore_crowd: true
  clean_correct_min_prob: 0.20
  clean_correct_min_margin: 0.02
  minimum_clean_images: 128
  prompt_templates:
    - "a photo of a {label}."
    - "a cropped photo of a {label}."
    - "a photo containing a {label}."
  clip:
    backend: open_clip
    model_name: ViT-B-32
    pretrained: openai
    pretrained_path: outputs/cache/open_clip/ViT-B-32.pt
    cache_dir: outputs/cache/open_clip
    batch_size: 64
    precision: fp32
    weights_only: false
    force_quick_gelu: true
    image_mean: [0.48145466, 0.4578275, 0.40821073]
    image_std: [0.26862954, 0.26130258, 0.27577711]
    image_interpolation: bicubic
    image_resize_mode: shortest
output_dir: outputs/analysis/pc_coco_object_clip_audit
