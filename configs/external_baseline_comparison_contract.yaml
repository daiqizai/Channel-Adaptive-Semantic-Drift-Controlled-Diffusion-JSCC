research_boundary:
  project_mainline_unchanged: true
  awgn_minimal_closure_preserved: true
  semantic_drift_is_primary_failure_mode: true
  no_new_large_model_training: true

comparison_tracks:
  author_native:
    purpose: reproduce_author_pipeline_before_adaptation
    direct_ranking_against_ours_allowed: false
    reason: resolution_rate_side_information_and_dataset_contracts_differ
  common_contract:
    purpose: compare_methods_on_the_same_images_channel_and_metrics
    direct_ranking_against_ours_allowed: true
    require_total_rate_accounting: true
    require_same_source_images: true
    require_same_awgn_realizations: true

common_contract:
  dataset: COCO2017_train2017_frozen_scaleup_validation
  source_manifest: outputs/EXP-S13-001/source_manifest.json
  source_dir: outputs/eval/s13_coco_train2017_c8_scaleup_10k_1k/exports/original
  split_role: integration_development_only
  sample_name_start: 10000
  sample_count_smoke: 8
  sample_count_stage: 64
  sample_count_full_development: 1000
  image_size: 256
  channel: AWGN
  snrs_db: [1, 4, 7, 13, 19]
  channel_seeds: [20260729, 20260730, 20260731]
  cbr_denominator: 3x256x256_real_source_dimensions
  real_dimensions_per_complex_channel_use: 2
  cbr_definition: total_real_channel_coordinates_divided_by_2_then_divided_by_source_real_dimensions
  target_cbr: 0.16666666666666666
  target_total_real_symbols: 65536
  official_imagenette_validation_forbidden: true
  final_claim_requires_fresh_frozen_population: true

metrics:
  image_quality: [PSNR, MS_SSIM]
  perceptual_quality: [LPIPS]
  distribution_quality: [FID_or_KID_only_when_sample_count_is_valid]
  semantic_reliability:
    - T_cls_clean_correct_final_failure
    - T_cls_new_error
    - T_cls_repair
    - image_cluster_one_sided_Clopper_Pearson_upper
  systems:
    - total_real_symbols
    - side_information_real_symbols
    - runtime_ms_per_image
    - peak_gpu_memory_mib

rate_accounting:
  count_main_latent: true
  count_edge_or_structure_branch: true
  count_text_or_semantic_payload: true
  count_pilots_and_csi_payload: true
  free_oracle_side_information_forbidden_in_common_contract: true
  unknown_rate_blocks_direct_ranking: true

