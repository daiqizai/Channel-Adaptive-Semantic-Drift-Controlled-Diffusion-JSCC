  status: policy_frozen_before_holdout_output
  preregistration: reports/snr_identity_envelope_preregistration_2026-07-15.md
  project_commit_at_registration: abf117bc9aa194cd0a4fa80bd63df6baae1f6d29
  official_imagenette_accessed: false
