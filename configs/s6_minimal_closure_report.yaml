phase: S6
analysis_id: minimal_closure_report
method: MinimalClosureReport
dataset: COCO2017
image_size: 256
channel: AWGN
snrs: [1, 4, 7, 13, 19]
cbr: 0.17
seed: 42
repository_url: https://github.com/daiqizai/Channel-Adaptive-Semantic-Drift-Controlled-Diffusion-JSCC.git

inputs:
  m0_formal_metrics: outputs/eval/s2_deepjscc_coco256_awgn_best_m0_export/metrics.json
  m1_blind_diffusion_metrics: outputs/EXP-S2-002/metrics.json
  residual_validation_summary: outputs/EXP-S4-006/summary.csv
  residual_validation_report: outputs/EXP-S4-006/REPORT.md
  residual_shrink_validation_summary: outputs/analysis/exp_s4_006_residual_shrink_selection/summary.csv
  heldout_residual_shrink_summary: outputs/analysis/exp_s4_006_heldout_residual_shrink_schedule_check/summary.csv
  testlike_residual_shrink_summary: outputs/analysis/exp_s4_006_testlike_residual_shrink_schedule_check/summary.csv
  adaptive_residual_alpha_summary: outputs/analysis/exp_s4_006_adaptive_residual_alpha_policy/summary.csv
  two_stage_residual_alpha_summary: outputs/analysis/exp_s4_006_two_stage_residual_alpha_policy/summary.csv
  receiver_alpha_predictor_summary: outputs/analysis/exp_s4_006_receiver_alpha_predictor/summary.csv
  testlike_policy_summary: outputs/analysis/exp_s4_006_testlike_risk_rule_check/policy_summary.csv
  testlike_clean_correct_summary: outputs/analysis/exp_s4_006_testlike_coco_object_clip_clean_eval/summary.csv

methods:
  m0: M0-DeepJSCC-HR
  m1: M1-BlindDiffusion-SDImg2Img
  m2: M2-SNRConditionedPixelResidualRestoration
  m3_conservative: M3-ResidualRestorationTop1Fallback
  m3_shrink: M3-ResidualRestorationTop1ShrinkFallback
  m3_adaptive_alpha: M3-AdaptiveResidualAlphaTop1Fallback
  m3_candidate: M3-SelectedRiskRuleCandidate

notes:
  - This is a derived closure report. It does not train, refine, classify, or download.
  - EXP-S2-002 M1 uses 16 images/SNR at [1, 7, 19] and is a negative reference, not the same split as EXP-S4-006.
  - EXP-S4-006 residual validation uses 64 images/SNR at [1, 4, 7, 13, 19].
  - Residual shrink schedule was selected on EXP-S4-006 validation and then frozen on held-out and test-like splits.
  - Adaptive residual alpha policy uses a fixed receiver-side rule over existing alpha candidates and does not tune on held-out/test-like.
  - Two-stage residual alpha policy is a deployability ablation over the adaptive-alpha table; it omits LPIPS to avoid external weight loading.
  - Receiver alpha predictor is a validation-trained tabular pilot over receiver-visible features; it omits LPIPS to avoid external weight loading.
  - Test-like policy and COCO-object clean-correct tables are auxiliary semantic diagnostics, not final supervised truth.

outputs:
  output_dir: outputs/analysis/minimal_closure_report
