phase: S5
analysis_id: exp_s4_006_conf_gain_risk_rule_sweep
source_experiment: EXP-S4-006
method: ResidualConfidenceGainReceiverSideRiskRuleSweep
dataset: COCO2017
image_size: 256
channel: AWGN
snrs: [1, 4, 7, 13, 19]
cbr: 0.17
seed: 42
repository_url: https://github.com/daiqizai/Channel-Adaptive-Semantic-Drift-Controlled-Diffusion-JSCC.git

inputs:
  per_sample_with_clip_csv: outputs/analysis/exp_s4_006_conf_gain_clip_veto_sweep/per_sample_with_clip.csv
  validation_topk_csv: outputs/analysis/exp_s4_006_gate_policy_sweep/topk_predictions.csv
  heldout_topk_csv: outputs/analysis/exp_s4_006_heldout_gate_check/per_sample.csv
  validation_source: EXP-S4-006 eval split, sample_000192 to sample_000255
  heldout_source: EXP-S4-006 unused split, sample_000000 to sample_000031

policy:
  baseline: top1_equal
  candidate: top1_equal_or_refined_conf_gain_ge_0p05
  refined_conf_gain_margin: 0.05
  uses_original_for_detection: false
  receiver_side_features:
    - clip_sim_m0_refined
    - m0_refined_top5_overlap
    - m0_top1_rank_in_refined_top5
    - m0_top1_margin
    - refined_top1_margin

risk_rule_search:
  calibration_split: validation
  evaluation_splits: [validation, heldout]
  accepted_new_error_budget: 0
  selection_rule: maximize_validation_repairs_then_validation_psnr_then_prefer_conservative_shadow_veto
  clip_min_grid: [0.0, 0.90, 0.92, 0.94, 0.95, 0.96, 0.97, 0.98]
  top5_overlap_min_grid: [0, 1, 2, 3, 4]
  shadow_clip_max_grid: [0.94, 0.96, 0.98, 0.99, 1.01]
  shadow_m0_rank_max_grid: [1, 2, 3, 4, 5]
  shadow_m0_margin_max_grid: [0.015, 0.020, 0.025, 0.030, 0.035, 0.040, 0.050, 0.070]
  shadow_ref_margin_min_grid: [0.0, 0.03, 0.05, 0.08, 0.10, 0.15, 0.20]
  rule_template: accept_candidate_if_clip_ge_min_and_overlap_ge_min_and_not_shadow_veto
  shadow_veto: m0_top1 remains high-ranked in refined top-k, M0 top-1 margin is weak, refined top-1 margin is nontrivial, and CLIP(M0, refined) is below shadow_clip_max

evaluation:
  gallery_rows: 12
  warning: rules are selected on validation pseudo-labels only; held-out is for risk check and not used for calibration

outputs:
  output_dir: outputs/analysis/exp_s4_006_conf_gain_risk_rule_sweep
