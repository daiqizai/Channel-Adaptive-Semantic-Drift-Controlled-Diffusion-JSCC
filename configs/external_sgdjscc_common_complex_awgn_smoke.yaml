  cuda_device: cuda:0
  offline_runtime_assets_only: true

success_criteria:
  require_finite_output: true
  require_output_shape: [1, 3, 256, 256]
  require_patch_count: 4
  require_main_real_symbols: 16384
  require_active_edge_real_symbols: 3328
  require_text_real_symbols: 45024
  require_total_real_symbols: 65536
  require_common_cbr: 0.16666666666666666
  require_all_runtime_asset_hashes_match: true
  semantic_claim_forbidden_for_one_image_smoke: true

