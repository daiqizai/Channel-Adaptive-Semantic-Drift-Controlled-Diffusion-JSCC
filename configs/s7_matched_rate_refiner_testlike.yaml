  weights_file: outputs/cache/torch/hub/checkpoints/alexnet-owt-7be5be79.pth
  batch_size: 32
  topk: 5
policy:
  baseline: top1_equal
  candidate: top1_equal_or_refined_conf_gain
  refined_conf_gain_margin: 0.05
inference: {batch_size: 16}
evaluation: {sample_grid_count: 4}
outputs:
  output_dir: outputs/analysis/exp_s7_002_matched_rate_testlike
