phase: S34C-Lite-rate-transparency
status: completed_read_only_analysis
created_at: "2026-07-23"
new_training: false
new_model_inference: false
network_download: false
official_imagenette_validation_accessed: false
formal_output_creation_authorized: true

question: >-
  What do the already completed S33, S30 DiffJSCC, and S20/S28 SGD-JSCC
  evaluations show when communication rate, transmitted side information,
  receiver-side priors, task-training data, and compute are made explicit?

population:
  images: 64
  channel_seeds: [20260748, 20260749, 20260750]
  snrs_db: [1, 4, 7, 13, 19]
  rows_per_method: 960
  claim_scope: known_policy-development_not_independent_final_test

inputs:
  s33:
    per_sample: outputs/external_baselines/ANALYSIS-S33-STRONG-JSCC-16384-COMPARISON-001/per_sample.csv
    summary: outputs/external_baselines/ANALYSIS-S33-STRONG-JSCC-16384-COMPARISON-001/summary.json
  diffjscc:
    per_sample: outputs/external_baselines/ANALYSIS-S30-DIFFJSCC-COMPARISON-001/per_sample.csv
    summary: outputs/external_baselines/ANALYSIS-S30-DIFFJSCC-COMPARISON-001/summary.json
  sgdjscc:
    per_sample_by_seed:
      - outputs/external_baselines/ANALYSIS-S20-SGD-B1-DECISION-001/sgd_jscc_paper_protocol/seed_20260748/per_sample.csv
      - outputs/external_baselines/ANALYSIS-S20-SGD-B1-DECISION-001/sgd_jscc_paper_protocol/seed_20260749/per_sample.csv
      - outputs/external_baselines/ANALYSIS-S20-SGD-B1-DECISION-001/sgd_jscc_paper_protocol/seed_20260750/per_sample.csv
    summary: outputs/external_baselines/ANALYSIS-S28-CURRENT-VS-SGD-001/summary.json

rate_ledger:
  s33:
    main_real_symbols: 16384
    transmitted_side_info_real_symbols: 0
    minimum_total_real_symbols: 16384
    external_generative_prior: none
  diffjscc:
    main_real_symbols: 16384
    transmitted_side_info_real_symbols: 0
    receiver_generated_caption_real_symbols: 0
    minimum_total_real_symbols: 16384
    external_generative_prior: SD2.1_plus_BLIP2_plus_OpenCLIP
  sgd_paper_upper:
    main_real_symbols: 16384
    active_edge_real_symbols: 3328
    minimum_caption_real_symbols: 2144
    minimum_total_real_symbols: 21856
    overrun_vs_16384_real_symbols: 5472
    overrun_fraction_vs_16384: 0.333984375
    caption_delivery: perfect_unmetered_in_paper_protocol
    external_generative_prior: released_diffusion_backbone_plus_ControlNet_plus_BLIP2_CLIP

metrics:
  available: [PSNR, MS-SSIM, LPIPS, T_cls_failure]
  unavailable_without_new_evaluation: [FID, KID]
  report_aggregate_and_per_SNR: true
  confidence_level: 0.95
  bootstrap_replicates: 10000
  bootstrap_cluster: source_image

required_audits:
  - exact_960_key_equality
  - sample_seed_SNR_population_equality
  - canonical_noise_provenance_and_method_specific_use
  - metric_definition_and_uint8_float_path
  - rate_ledger_sum_and_caption_assumption
  - input_summary_and_per_sample_SHA256

interpretation_rules:
  forbid_global_winner_ranking: true
  forbid_calling_external_priors_channel_rate: true
  forbid_calling_SGD_LPIPS_advantage_rate_fair: true
  describe_S33_vs_DiffJSCC_as_exact-rate_fidelity-perception-reliability_positioning: true
  describe_SGD_as_non-ranking_paper-protocol_upper_bound: true
  FID_KID_absence_must_be_prominent: true

planned_outputs:
  analysis_id: ANALYSIS-S34C-LITE-RATE-TRANSPARENCY-001
  directory: outputs/analysis/ANALYSIS-S34C-LITE-RATE-TRANSPARENCY-001
  report: reports/s34c_lite_rate_transparency_result_2026-07-23.md
  files:
    - unified_method_table.csv
    - per_snr_table.csv
    - pairwise_descriptive_deltas_with_ci.csv
    - rate_and_prior_ledger.json
    - input_audit.json
    - summary.json

estimated_elapsed_hours: [6, 10]
overwrite_forbidden: true
