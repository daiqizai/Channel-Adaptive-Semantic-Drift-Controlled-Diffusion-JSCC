phase: S7
experiment_id: EXP-S7-001
method: WarmStartedMatchedTotalRateMainAndStructureDeepJSCCPilot
dataset: COCO2017
image_size: 256
channel: AWGN
snr_db: 7
seed: 20260711

protocol:
  status: pilot_not_final
  preregistration: reports/matched_rate_jscc_pilot_preregistration_2026-07-11.md
  source_checkpoint: outputs/train/s2_deepjscc_coco256_awgn_snr7_cbr017/checkpoints/best.pt
  source_inner_channel: 8
  latent_selection: encoder_decoder_geometric_l2
  cbr_denominator: 48

rate:
  main_inner_channel: 6
  main_cbr: 0.125
  structure_inner_channel: 2
  structure_cbr: 0.041666666666666664
  total_inner_channel: 8
  total_cbr: 0.16666666666666666
  reference_inner_channel: 8
  reference_cbr: 0.16666666666666666

data:
  train_root: data/coco/train2017
  val_root: data/coco/val2017
  train_subset: 20000
  val_subset: 512
  subset_method: torch_randperm_seed

representation:
  main: rgb
  structure: sobel_laplacian_rgb
  structure_channels:
    - sobel_magnitude
    - laplacian_abs
    - channelwise_max
  third_channel: maximum

training:
  batch_size: 32
  num_workers: 8
  amp: true
  grad_clip_norm: 1.0
  weight_decay: 0.0005
  eval_every: 1
  save_every: 1
  main:
    epochs: 8
    learning_rate: 0.00005
  structure:
    epochs: 12
    learning_rate: 0.0001

baseline:
  repo: third_party/Deep-JSCC-PyTorch
  source_url: https://github.com/chunbaobao/Deep-JSCC-PyTorch
  commit: 2665e0dc6d8bf216daf9442c5d6e5d69c5ad2f06

outputs:
  main_train_dir: outputs/train/s7_matched_rate_main_cbr0125_pilot20k
  structure_train_dir: outputs/train/s7_matched_rate_structure_cbr004167_pilot20k
