phase: S6
analysis_id: exp_s4_006_continuous_alpha_tail_refiner_audit
source_experiment: EXP-S4-006
method: ContinuousAlphaTailRefinerPerceptualEnsembleAudit
dataset: COCO2017
image_size: 256
channel: AWGN
snrs: [1, 4, 7, 13, 19]
cbr: 0.17
seed: 42
repository_url: https://github.com/daiqizai/Channel-Adaptive-Semantic-Drift-Controlled-Diffusion-JSCC.git

inputs:
  source_per_sample_csv: outputs/analysis/exp_s4_006_alpha_head_residual_refiner_tail_regression_benefit/per_sample.csv
  source_summary_csv: outputs/analysis/exp_s4_006_alpha_head_residual_refiner_tail_regression_benefit/summary.csv
  source_config: configs/s6_alpha_head_residual_refiner_tail_regression_benefit_exp_s4_006.yaml
  checkpoint: outputs/train/s2_deepjscc_coco256_awgn_snr7_cbr017/checkpoints/best.pt
  forbidden_checkpoint: outputs/train/s2_deepjscc_coco256_awgn_snr7_cbr017/checkpoints/latest.pt

policies:
  - key: continuous_alpha_top1_fallback
    source_policy: alpha_head_predicted_top1_fallback
    candidate_path_field: alpha_refined
    final_path_field: alpha_head_final
    decision_source: source_run_alexnet_top1_fallback
  - key: full_strength_top1_fallback
    source_policy: full_strength_top1_fallback
    candidate_path_field: full_refined
    final_path_field: full_strength_final
    decision_source: source_run_alexnet_top1_fallback

classifiers:
  cache_dir: outputs/cache/torch
  batch_size: 64
  topk: 5
  models:
    - key: alexnet
      model_name: alexnet
      weights_enum: AlexNet_Weights
      weights: IMAGENET1K_V1
      weights_file: outputs/cache/torch/hub/checkpoints/alexnet-owt-7be5be79.pth
    - key: resnet18
      model_name: resnet18
      weights_enum: ResNet18_Weights
      weights: IMAGENET1K_V1
      weights_file: outputs/cache/torch/hub/checkpoints/resnet18-f37072fd.pth
    - key: mobilenet_v3_small
      model_name: mobilenet_v3_small
      weights_enum: MobileNet_V3_Small_Weights
      weights: IMAGENET1K_V1
      weights_file: outputs/cache/torch/hub/checkpoints/mobilenet_v3_small-047dcff4.pth

evaluation:
  image_batch_size: 16
  gallery_rows: 12
  lpips: enabled_if_local_import_succeeds
  warning: offline ensemble audit only; COCO pseudo-labels are not final clean-correct labels

notes:
  - This audit only reads existing continuous-alpha tail-only residual refiner outputs.
  - It does not train a model, run diffusion, tune a policy, or download data.
  - LPIPS is computed as a perceptual audit if the local lpips package/weights load successfully.
  - AlexNet/ResNet18/MobileNetV3-Small are offline robustness probes; only the source run's AlexNet gate is the receiver-side decision.

outputs:
  output_dir: outputs/analysis/exp_s4_006_continuous_alpha_tail_refiner_audit
