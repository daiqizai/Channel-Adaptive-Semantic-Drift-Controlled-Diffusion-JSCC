phase: S7
experiment_id: EXP-S7-002
method: MatchedTotalRateDecodedStructureGuidedResidualRefinerPilot
dataset: COCO2017
image_size: 256
channel: AWGN
snrs: [1, 4, 7, 13, 19]
cbr: 0.16666666666666666
seed: 20260711
repository_url: https://github.com/daiqizai/Channel-Adaptive-Semantic-Drift-Controlled-Diffusion-JSCC.git

rate:
  main_inner_channel: 6
  main_cbr: 0.125
  structure_inner_channel: 2
  structure_cbr: 0.041666666666666664
  total_inner_channel: 8
  total_cbr: 0.16666666666666666
  reference_inner_channel: 8
  reference_cbr: 0.16666666666666666

inputs:
  m0_export_dir: outputs/eval/s7_matched_rate_main_structure_pilot20k_export_384
  m0_reconstruction_subdir: main_reconstruction
  structure_export_dir: outputs/eval/s7_matched_rate_main_structure_pilot20k_export_384
  structure_reconstruction_subdir: structure_reconstruction
  original_dir: outputs/eval/s7_matched_rate_main_structure_pilot20k_export_384/exports/original
  checkpoint: outputs/train/s7_matched_rate_main_cbr0125_pilot20k/checkpoints/best.pt
  forbidden_checkpoint: outputs/train/s7_matched_rate_main_cbr0125_pilot20k/checkpoints/latest.pt

split:
  train_sample_start: 32
  train_sample_count: 160
  eval_sample_start: 192
  eval_sample_count: 64

model:
  name: matched_rate_decoded_structure_conditioned_residual_cnn
  input_channels: 6
  condition_features:
    - sobel_magnitude
    - laplacian_abs
  condition_source: decoded_structure_rgb
  base_channels: 64
  num_blocks: 6
  snr_norm_max: 20.0
  residual_gates:
    "1": 0.12
    "4": 0.10
    "7": 0.08
    "13": 0.05
    "19": 0.04

training:
  epochs: 60
  batch_size: 16
  num_workers: 4
  crop_size: 128
  random_flip: true
  lr: 0.001
  weight_decay: 0.0
  grad_clip_norm: 1.0
  mse_weight: 1.0
  l1_weight: 0.10
  validation_every_epochs: 5

classifier:
  backend: torchvision
  model_name: alexnet
  weights: IMAGENET1K_V1
  cache_dir: outputs/cache/torch
  weights_file: outputs/cache/torch/hub/checkpoints/alexnet-owt-7be5be79.pth
  batch_size: 32
  topk: 5

failure_handling:
  detector: top1_agreement_with_main_c6_m0
  accept_when: refined_classifier_top1_equals_main_c6_m0_classifier_top1
  fallback_output: main_c6_m0_reconstruction
  uses_original_for_detection: false

evaluation:
  sample_grid_count: 4
  pseudo_clean_conf_thresholds: [0.20, 0.30]
  metrics:
    - psnr
    - ssim
    - ms_ssim
    - lpips
    - pseudo_drift
    - pseudo_final_failure
    - accept_rate

notes:
  - Both main RGB and structural maps traverse explicit independent AWGN DeepJSCC paths.
  - The refiner reads only receiver-visible main_reconstruction and decoded structure RGB.
  - Total CBR is exactly 6/48 + 2/48 = 8/48 = 1/6, matching the reference c=8 path.
  - This remains a 20k warm-start pilot and must be compared against the c=8 reference before promotion.

outputs:
  output_dir: outputs/EXP-S7-002
