inputs:
  cache_root: outputs/eval/s16_lowrate_m3_exact19712_uint2r4_coco10k_1k
  source_manifest: outputs/eval/s16_lowrate_m3_exact19712_uint2r4_coco10k_1k/source_manifest.csv
  deepjscc_checkpoint: outputs/train/external_author_rate_deepjscc_c3_mask19712_fullcoco_continue/checkpoints/best.pt
