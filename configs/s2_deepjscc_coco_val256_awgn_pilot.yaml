phase: S2-HR
method: High-resolution DeepJSCC training
dataset: COCO2017-val-split-pilot
image_size: 256
channel: AWGN
snr_db: 7
cbr: 0.17
inner_channel: 8
seed: 42

data:
  train_root: data/coco_val_split/train
  val_root: data/coco_val_split/val
  train_subset: null
  val_subset: null

training:
  epochs: 50
  batch_size: 16
  num_workers: 4
  learning_rate: 0.0001
  weight_decay: 0.0005
  grad_clip_norm: 1.0
  amp: true
  save_every: 1
  eval_every: 1
  max_train_batches: null
  max_val_batches: null

baseline:
  repo: third_party/Deep-JSCC-PyTorch
  source_url: https://github.com/chunbaobao/Deep-JSCC-PyTorch
  commit: 2665e0dc6d8bf216daf9442c5d6e5d69c5ad2f06

outputs:
  train_dir: outputs/train/s2_deepjscc_coco_val256_awgn_snr7_cbr017_pilot
  smoke_dir: outputs/smoke/s2_deepjscc_coco_val256_train_pilot
