phase: S5
analysis_id: exp_s4_006_testlike_risk_rule_check
source_experiment: EXP-S4-006
method: ApplyFrozenSelectedRiskRuleOnTestlikeSplit
dataset: COCO2017
image_size: 256
channel: AWGN
snrs: [1, 4, 7, 13, 19]
cbr: 0.17
seed: 42
repository_url: https://github.com/daiqizai/Channel-Adaptive-Semantic-Drift-Controlled-Diffusion-JSCC.git

inputs:
  testlike_csv: outputs/analysis/exp_s4_006_testlike_gate_check/per_sample.csv
  selected_risk_rule_json: outputs/analysis/exp_s4_006_conf_gain_risk_rule_sweep/selected_rule.json
  conservative_veto_rule_json: outputs/analysis/exp_s4_006_ensemble_risk_veto_sweep/selected_rule.json
  source_risk_rule_config: configs/s5_conf_gain_risk_rule_sweep_exp_s4_006.yaml
  source_conservative_veto_config: configs/s5_ensemble_risk_veto_sweep_exp_s4_006.yaml
  checkpoint: outputs/train/s2_deepjscc_coco256_awgn_snr7_cbr017/checkpoints/best.pt
  forbidden_checkpoint: outputs/train/s2_deepjscc_coco256_awgn_snr7_cbr017/checkpoints/latest.pt

policy:
  split_name: testlike
  baseline: top1_equal
  candidate: top1_equal_or_refined_conf_gain_ge_0p05
  refined_conf_gain_margin: 0.05
  fixed_clip_threshold: 0.98
  frozen_rules:
    - selected_risk_rule
    - selected_risk_rule_plus_ensemble_veto
  materialize_policies:
    - selected_risk_rule
    - selected_risk_rule_plus_ensemble_veto
  uses_original_for_detection: false
  note: rules are frozen from validation/held-out analyses and are not tuned on test-like samples

clip:
  backend: open_clip
  model_name: ViT-B-32
  pretrained: openai
  pretrained_url: https://openaipublic.azureedge.net/clip/models/40d365715913c9da98579312b702a82c18be219cc2a73407c4526f58eba950af/ViT-B-32.pt
  pretrained_path: outputs/cache/open_clip/ViT-B-32.pt
  cache_dir: outputs/cache/open_clip
  batch_size: 32
  precision: fp32
  weights_only: false
  force_quick_gelu: true
  image_mean: [0.48145466, 0.4578275, 0.40821073]
  image_std: [0.26862954, 0.26130258, 0.27577711]
  image_interpolation: bicubic
  image_resize_mode: shortest

evaluation:
  gallery_rows: 12
  warning: test-like split is for frozen-rule risk check only; pseudo-label metrics remain auxiliary, not final clean-correct test results

outputs:
  output_dir: outputs/analysis/exp_s4_006_testlike_risk_rule_check
