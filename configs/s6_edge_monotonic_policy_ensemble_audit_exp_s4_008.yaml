phase: S6
analysis_id: exp_s4_008_edge_monotonic_policy_ensemble_audit
source_experiment: EXP-S4-008
method: EdgeMonotonicResidualPolicyPerceptualEnsembleAudit
dataset: COCO2017
image_size: 256
channel: AWGN
snrs: [1, 4, 7, 13, 19]
cbr: 0.17
seed: 42
repository_url: https://github.com/daiqizai/Channel-Adaptive-Semantic-Drift-Controlled-Diffusion-JSCC.git

inputs:
  source_runs:
    - id: validation
      split: validation
      per_sample_csv: outputs/analysis/exp_s4_008_edge_monotonic_residual_shrink_selection/per_sample.csv
      summary_csv: outputs/analysis/exp_s4_008_edge_monotonic_residual_shrink_selection/summary.csv
      config: outputs/analysis/exp_s4_008_edge_monotonic_residual_shrink_selection/config.yaml
    - id: heldout
      split: held-out
      per_sample_csv: outputs/analysis/exp_s4_008_edge_monotonic_heldout_residual_shrink_schedule_check/per_sample.csv
      summary_csv: outputs/analysis/exp_s4_008_edge_monotonic_heldout_residual_shrink_schedule_check/summary.csv
      config: outputs/analysis/exp_s4_008_edge_monotonic_heldout_residual_shrink_schedule_check/config.yaml
    - id: testlike
      split: test-like
      per_sample_csv: outputs/analysis/exp_s4_008_edge_monotonic_testlike_residual_shrink_schedule_check/per_sample.csv
      summary_csv: outputs/analysis/exp_s4_008_edge_monotonic_testlike_residual_shrink_schedule_check/summary.csv
      config: outputs/analysis/exp_s4_008_edge_monotonic_testlike_residual_shrink_schedule_check/config.yaml
    - id: fresh_holdout
      split: fresh-holdout
      per_sample_csv: outputs/analysis/exp_s4_008_edge_monotonic_fresh_holdout_residual_shrink_schedule_check/per_sample.csv
      summary_csv: outputs/analysis/exp_s4_008_edge_monotonic_fresh_holdout_residual_shrink_schedule_check/summary.csv
      config: outputs/analysis/exp_s4_008_edge_monotonic_fresh_holdout_residual_shrink_schedule_check/config.yaml
  method_checkpoint: outputs/EXP-S4-008/checkpoints/best.pt
  forbidden_method_checkpoint: outputs/EXP-S4-008/checkpoints/latest.pt
  jscc_checkpoint: outputs/train/s2_deepjscc_coco256_awgn_snr7_cbr017/checkpoints/best.pt

policies:
  - key: edge_monotonic_top1_fallback
    source_id: validation
    source_policy: selected_top1_fallback_shrink_schedule
    candidate_path_field: candidate
    final_path_field: final_source
    accepted_field: accept_candidate
    alpha_field: alpha
    missed_repair_field: rejected_good
  - key: edge_monotonic_top1_fallback
    source_id: heldout
    source_policy: validation_top1_shrink_schedule
    candidate_path_field: candidate
    final_path_field: final_source
    accepted_field: accept_candidate
    alpha_field: alpha
    missed_repair_field: rejected_good
  - key: edge_monotonic_top1_fallback
    source_id: testlike
    source_policy: validation_top1_shrink_schedule
    candidate_path_field: candidate
    final_path_field: final_source
    accepted_field: accept_candidate
    alpha_field: alpha
    missed_repair_field: rejected_good
  - key: edge_monotonic_top1_fallback
    source_id: fresh_holdout
    source_policy: validation_top1_shrink_schedule
    candidate_path_field: candidate
    final_path_field: final_source
    accepted_field: accept_candidate
    alpha_field: alpha
    missed_repair_field: rejected_good

classifiers:
  cache_dir: outputs/cache/torch
  batch_size: 64
  topk: 5
  models:
    - key: alexnet
      model_name: alexnet
      weights_enum: AlexNet_Weights
      weights: IMAGENET1K_V1
      weights_file: outputs/cache/torch/hub/checkpoints/alexnet-owt-7be5be79.pth
    - key: resnet18
      model_name: resnet18
      weights_enum: ResNet18_Weights
      weights: IMAGENET1K_V1
      weights_file: outputs/cache/torch/hub/checkpoints/resnet18-f37072fd.pth
    - key: mobilenet_v3_small
      model_name: mobilenet_v3_small
      weights_enum: MobileNet_V3_Small_Weights
      weights: IMAGENET1K_V1
      weights_file: outputs/cache/torch/hub/checkpoints/mobilenet_v3_small-047dcff4.pth

evaluation:
  image_batch_size: 16
  gallery_rows: 12
  lpips: supplied_by_frozen_schedule_runs
  warning: offline ensemble audit only; COCO pseudo-labels are not final clean-correct labels

report:
  title: EXP-S4-008 Monotonic Edge Policy Audit
  description: This derived audit evaluates the frozen monotonic edge schedule on validation, held-out, test-like, and untouched fresh-holdout outputs. It does not train, tune, or download.

notes:
  - AlexNet is the source decision model; ResNet18 and MobileNetV3-Small are independent offline robustness probes.
  - The fresh-holdout split is sample_000320-sample_000383 and was not used to choose the schedule.
  - LPIPS is computed by the frozen schedule runs; use --skip-lpips here to avoid redundant recomputation.

outputs:
  output_dir: outputs/analysis/exp_s4_008_edge_monotonic_policy_ensemble_audit
