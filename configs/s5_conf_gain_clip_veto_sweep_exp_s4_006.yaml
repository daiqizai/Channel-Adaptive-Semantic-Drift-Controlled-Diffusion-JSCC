phase: S5
analysis_id: exp_s4_006_conf_gain_clip_veto_sweep
source_experiment: EXP-S4-006
method: ResidualConfidenceGainReceiverSideClipVetoSweep
dataset: COCO2017
image_size: 256
channel: AWGN
snrs: [1, 4, 7, 13, 19]
cbr: 0.17
seed: 42
repository_url: https://github.com/daiqizai/Channel-Adaptive-Semantic-Drift-Controlled-Diffusion-JSCC.git

inputs:
  validation_csv: outputs/analysis/exp_s4_006_conf_gain_gate_aux_audit/per_sample_audit.csv
  heldout_csv: outputs/analysis/exp_s4_006_heldout_gate_check/per_sample.csv
  validation_source: EXP-S4-006 eval split, sample_000192 to sample_000255
  heldout_source: EXP-S4-006 unused split, sample_000000 to sample_000031
  checkpoint: outputs/train/s2_deepjscc_coco256_awgn_snr7_cbr017/checkpoints/best.pt
  forbidden_checkpoint: outputs/train/s2_deepjscc_coco256_awgn_snr7_cbr017/checkpoints/latest.pt

policy:
  baseline: top1_equal
  candidate: top1_equal_or_refined_conf_gain_ge_0p05
  refined_conf_gain_margin: 0.05
  clip_veto_target: confidence_gain_new_accepts_only
  decision_inputs:
    - m0_top1_prob
    - refined_top1_prob
    - m0_top1_index_or_label
    - refined_top1_index_or_label
    - clip_sim_m0_refined
  uses_original_for_detection: false
  veto_thresholds: [0.90, 0.92, 0.94, 0.96, 0.97, 0.98, 0.985, 0.99, 0.995]

clip:
  backend: open_clip
  model_name: ViT-B-32
  pretrained: openai
  pretrained_url: https://openaipublic.azureedge.net/clip/models/40d365715913c9da98579312b702a82c18be219cc2a73407c4526f58eba950af/ViT-B-32.pt
  pretrained_path: outputs/cache/open_clip/ViT-B-32.pt
  cache_dir: outputs/cache/open_clip
  batch_size: 32
  precision: fp32
  weights_only: false
  force_quick_gelu: true
  image_mean: [0.48145466, 0.4578275, 0.40821073]
  image_std: [0.26862954, 0.26130258, 0.27577711]
  image_interpolation: bicubic
  image_resize_mode: shortest

evaluation:
  selected_policy_rule: prefer_zero_accepted_new_error_on_validation_and_heldout_then_max_repairs
  gallery_rows: 12
  warning: CLIP M0-refined similarity is receiver-side but remains an auxiliary veto; classification pseudo-label final failure stays the main tracked failure metric.

outputs:
  output_dir: outputs/analysis/exp_s4_006_conf_gain_clip_veto_sweep
