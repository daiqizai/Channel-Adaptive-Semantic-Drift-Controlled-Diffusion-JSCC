phase: S4
experiment_id: EXP-S3-001
method: CLIP image consistency diagnostic
dataset: COCO2017
image_size: 256
channel: AWGN
snrs: [1, 7, 19]
cbr: 0.17
seed: 42

inputs:
  m0_export_dir: outputs/eval/s2_deepjscc_coco256_awgn_best_m0_export
  original_dir: outputs/eval/s2_deepjscc_coco256_awgn_best_m0_export/exports/original
  m1_output_dir: outputs/EXP-S2-002
  m1_metrics: outputs/EXP-S2-002/metrics.json
  source_manifest: outputs/EXP-S2-002/source_manifest.json
  checkpoint: outputs/train/s2_deepjscc_coco256_awgn_snr7_cbr017/checkpoints/best.pt
  forbidden_checkpoint: outputs/train/s2_deepjscc_coco256_awgn_snr7_cbr017/checkpoints/latest.pt

clip:
  backend: open_clip
  model_name: ViT-B-32
  pretrained: openai
  pretrained_url: https://openaipublic.azureedge.net/clip/models/40d365715913c9da98579312b702a82c18be219cc2a73407c4526f58eba950af/ViT-B-32.pt
  pretrained_path: outputs/cache/open_clip/ViT-B-32.pt
  cache_dir: outputs/cache/open_clip
  batch_size: 16
  precision: fp32
  weights_only: false
  force_quick_gelu: true
  image_mean: [0.48145466, 0.4578275, 0.40821073]
  image_std: [0.26862954, 0.26130258, 0.27577711]
  image_interpolation: bicubic
  image_resize_mode: shortest

evaluation:
  num_samples: 16
  relative_drop_thresholds: [0.02, 0.05, 0.10]
  top_failure_count: 8

outputs:
  output_dir: outputs/EXP-S3-001
