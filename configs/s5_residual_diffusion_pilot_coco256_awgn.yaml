phase: S5
experiment_id: EXP-S4-007
method: SNRConditionedPixelResidualDiffusionPilot
dataset: COCO2017
image_size: 256
channel: AWGN
snrs: [1, 4, 7, 13, 19]
cbr: 0.17
seed: 42
repository_url: https://github.com/daiqizai/Channel-Adaptive-Semantic-Drift-Controlled-Diffusion-JSCC.git

inputs:
  m0_export_dir: outputs/eval/s2_deepjscc_coco256_awgn_best_m0_export_256
  original_dir: outputs/eval/s2_deepjscc_coco256_awgn_best_m0_export_256/exports/original
  checkpoint: outputs/train/s2_deepjscc_coco256_awgn_snr7_cbr017/checkpoints/best.pt
  forbidden_checkpoint: outputs/train/s2_deepjscc_coco256_awgn_snr7_cbr017/checkpoints/latest.pt

split:
  train_sample_start: 32
  train_sample_count: 80
  eval_sample_start: 192
  eval_sample_count: 16

model:
  name: small_snr_conditioned_residual_ddpm
  input_channels: 8
  base_channels: 32
  num_blocks: 4
  snr_norm_max: 20.0
  residual_gates:
    "1": 0.12
    "4": 0.10
    "7": 0.08
    "13": 0.05
    "19": 0.04

diffusion:
  timesteps: 20
  beta_start: 0.0001
  beta_end: 0.02
  prediction_type: epsilon

training:
  epochs: 20
  batch_size: 16
  num_workers: 4
  crop_size: 128
  random_flip: true
  lr: 0.001
  weight_decay: 0.0
  grad_clip_norm: 1.0
  epsilon_loss_weight: 1.0
  x0_loss_weight: 0.10
  validation_every_epochs: 5

sampling:
  sampler: ddim_deterministic
  steps: 20
  seed: 1234

classifier:
  backend: torchvision
  model_name: alexnet
  weights: IMAGENET1K_V1
  cache_dir: outputs/cache/torch
  weights_file: outputs/cache/torch/hub/checkpoints/alexnet-owt-7be5be79.pth
  batch_size: 32
  topk: 5

failure_handling:
  detector: top1_agreement_with_m0
  accept_when: refined_classifier_top1_equals_m0_classifier_top1
  fallback_output: m0_reconstruction
  uses_original_for_detection: false

evaluation:
  sample_grid_count: 4
  pseudo_clean_conf_thresholds: [0.20, 0.30]
  metrics:
    - psnr
    - ssim
    - ms_ssim
    - lpips_optional
    - pseudo_drift
    - pseudo_final_failure
    - accept_rate

outputs:
  output_dir: outputs/EXP-S4-007
